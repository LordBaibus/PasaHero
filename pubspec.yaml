name: pasahero
description: Local transport route and fare guide with PHP API CRUD over LAN.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Liquid Glass UI widgets (iOS 26 style). Requires Flutter 3.41 or newer.
  liquid_glass_widgets: ^1.4.3

  # The glass widgets use CupertinoIcons glyphs internally, so keep this.
  cupertino_icons: ^1.0.8

  # HTTP client used to talk to the PHP API.
  http: ^1.2.2

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true